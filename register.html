<!doctype html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Створіть акаунт BusinessNavigator через Google або email.">
  <title>Реєстрація - BusinessNavigator</title>
  <link rel="icon" href="assets/images/businessnavigator-compass.png" type="image/png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="page-shell">
    <nav class="site-nav">
      <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/images/businessnavigator-compass.png" alt=""></span><span class="brand-word">BusinessNavigator</span></a>
      <div class="nav-actions" style="margin-left:auto"><a class="auth-link" href="login.html">Вже є акаунт</a></div>
    </nav>
    <div class="auth-layout">
      <div class="auth-visual">
        <img src="assets/images/auth-register.jpg" alt="Команда стартапу працює над спільним продуктом" fetchpriority="high">
        <div class="auth-visual-copy"><h1>СТВОРІТЬ СВОЮ ПРОФЕСІЙНУ ПРИСУТНІСТЬ</h1><p>Оберіть профіль спеціаліста, компанії або стартапу. Один акаунт відкриває всю екосистему.</p></div>
      </div>
      <div class="auth-panel">
        <form class="auth-box" data-auth-form="register">
          <h2>РЕЄСТРАЦІЯ</h2>
          <p class="auth-sub">Один акаунт - усі бізнес-можливості.</p>
          <div class="oauth-row">
            <button class="oauth-btn" type="button" data-auth-provider="google" aria-label="Зареєструватися через Google"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.2c0-.7-.1-1.4-.2-2H12v3.8h5a4.3 4.3 0 0 1-1.8 2.8v2.3h3c1.8-1.6 2.8-4 2.8-6.9Z"/></svg>Google</button>
            <button class="oauth-btn" type="button" aria-disabled="true" title="Apple-вхід буде додано пізніше"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 12.8c0-2.7 2.2-4 2.3-4.1-1.3-1.9-3.3-2.1-4-2.1-1.7-.2-3.3 1-4.1 1-.8 0-2.1-1-3.5-1-1.8 0-3.5 1.1-4.4 2.7-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.5 2.7 1.4-.1 1.9-.9 3.6-.9s2.2.9 3.7.9c1.5 0 2.5-1.3 3.4-2.7 1-1.5 1.5-3 1.5-3.1-.1 0-3.4-1.3-3.4-5.3Z"/></svg>Apple</button>
          </div>
          <span class="oauth-hint">Apple-вхід - незабаром</span>
          <div class="field" style="margin-top:22px"><label for="profile-type">Тип профілю</label><select id="profile-type" name="profileType"><option value="specialist">Спеціаліст / кандидат</option><option value="company">Компанія / роботодавець</option><option value="startup">Стартап / засновник</option><option value="expert">Експерт / ментор</option></select></div>
          <div class="field"><label for="register-name">Ім'я або назва</label><input id="register-name" name="displayName" autocomplete="name" required placeholder="Ваше ім'я / компанія"></div>
          <div class="field"><label for="register-email">Email</label><input id="register-email" name="email" type="email" autocomplete="email" required placeholder="you@email.com"></div>
          <div class="field"><label for="register-password">Пароль</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Мінімум 8 символів"></div>
          <button class="primary-btn" type="submit">СТВОРИТИ АКАУНТ</button>
          <p class="form-note" data-form-note aria-live="polite"></p>
          <p class="auth-meta">Реєструючись, ви погоджуєтеся з умовами платформи.</p>
        </form>
      </div>
    </div>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
